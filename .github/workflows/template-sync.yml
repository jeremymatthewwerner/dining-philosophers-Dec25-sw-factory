name: Sync to Template Repo

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no push)'
        type: boolean
        default: false
  # Auto-trigger when workflows or core docs change on main
  push:
    branches: [main]
    paths:
      - '.github/workflows/bug-fix.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/ci-failure-monitor.yml'
      - '.github/workflows/ci-watcher.yml'
      - '.github/workflows/devops.yml'
      - '.github/workflows/factory-manager.yml'
      - '.github/workflows/factory-tests.yml'
      - '.github/workflows/principal-engineer.yml'
      - '.github/workflows/qa.yml'
      - '.github/workflows/release-eng.yml'
      - '.github/workflows/marketing.yml'
      - '.github/workflows/triage.yml'
      - '.github/workflows/product-manager.yml'
      - '.github/apps/**'
      - '.github/examples/**'
      - 'scripts/setup-github-apps.sh'
      - 'scripts/flaky-test-hunter.sh'
      - 'docs/**'
      - 'CLAUDE.md'
      - 'REQUIREMENTS.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dining-philosophers
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout template repo
        uses: actions/checkout@v4
        with:
          repository: jeremymatthewwerner/claude-software-factory-template
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
          path: template

      - name: Sync files
        run: |
          echo "Syncing files to template repo..."

          # Files to sync (add more as needed)
          # NOTE: template-sync.yml is NOT synced (it's specific to this repo)
          FILES=(
            ".github/workflows/bug-fix.yml"
            ".github/workflows/ci.yml"
            ".github/workflows/ci-failure-monitor.yml"
            ".github/workflows/ci-watcher.yml"
            ".github/workflows/devops.yml"
            ".github/workflows/factory-manager.yml"
            ".github/workflows/factory-tests.yml"
            ".github/workflows/principal-engineer.yml"
            ".github/workflows/qa.yml"
            ".github/workflows/release-eng.yml"
            ".github/workflows/marketing.yml"
            ".github/workflows/triage.yml"
            ".github/workflows/product-manager.yml"
            "CLAUDE.md"
            "REQUIREMENTS.md"
            "docs/CODE_AGENT.md"
            "docs/DEVOPS.md"
            "docs/FACTORY_MANAGER.md"
            "docs/OBSERVABILITY.md"
            "docs/PRINCIPAL_ENGINEER.md"
            "docs/QA_AGENT.md"
            "docs/RELEASE_ENG.md"
            "docs/TRIAGE.md"
            "docs/AGENT_REFERENCE.md"
            "scripts/flaky-test-hunter.sh"
          )

          # GitHub Apps files
          GITHUB_APPS_FILES=(
            ".github/apps/code-agent.json"
            ".github/apps/devops.json"
            ".github/apps/factory-manager.json"
            ".github/apps/qa.json"
            ".github/apps/triage.json"
            ".github/examples/bug-fix-with-app.yml.example"
            "scripts/setup-github-apps.sh"
            "docs/GITHUB_APPS.md"
          )

          # Create directories if needed
          mkdir -p template/.github/apps
          mkdir -p template/.github/examples
          mkdir -p template/scripts
          mkdir -p template/docs

          # Copy GitHub Apps files
          for file in "${GITHUB_APPS_FILES[@]}"; do
            if [ -f "source/$file" ]; then
              echo "Copying $file"
              cp "source/$file" "template/$file"
            fi
          done

          for file in "${FILES[@]}"; do
            if [ -f "source/$file" ]; then
              echo "Copying $file"
              cp "source/$file" "template/$file"
            fi
          done

      - name: Generalize project-specific references
        working-directory: template
        run: |
          echo "Generalizing project-specific references..."

          # Common replacements for all files
          REPLACEMENTS=(
            's/diningphilosophers\.ai/example.com/g'
            's/api\.diningphilosophers\.ai/api.example.com/g'
            's/dining-philosophers-Dec25-sw-factory/your-project/g'
            's/dining-philosophers/your-project/g'
            's/Dining Philosophers/Your Project/g'
            's/@jeremymatthewwerner/@your-github-username/g'
            's/jeremymatthewwerner\/your-project/your-org\/your-project/g'
          )

          # Build sed command
          SED_ARGS=""
          for rep in "${REPLACEMENTS[@]}"; do
            SED_ARGS="$SED_ARGS -e '$rep'"
          done

          # Apply to workflow files
          find .github/workflows -name "*.yml" -exec sh -c "sed -i $SED_ARGS \"\$1\"" _ {} \;

          # Apply to markdown docs (root and docs/)
          for file in CLAUDE.md REQUIREMENTS.md; do
            if [ -f "$file" ]; then
              echo "Generalizing $file"
              eval "sed -i $SED_ARGS \"$file\""
            fi
          done

          # Apply to all docs/*.md files
          for file in docs/*.md; do
            if [ -f "$file" ]; then
              echo "Generalizing $file"
              eval "sed -i $SED_ARGS \"$file\""
            fi
          done

          # Apply to scripts (flaky-test-hunter.sh has project-specific paths)
          for file in scripts/flaky-test-hunter.sh; do
            if [ -f "$file" ]; then
              echo "Generalizing $file"
              eval "sed -i $SED_ARGS \"$file\""
            fi
          done

          # Generalize GitHub Apps manifests (remove "DP " prefix from names)
          if [ -d ".github/apps" ]; then
            echo "Generalizing GitHub Apps manifests..."
            for file in .github/apps/*.json; do
              if [ -f "$file" ]; then
                # Remove "DP " prefix from app names
                sed -i 's/"DP /"/' "$file"
              fi
            done
          fi

          # Generalize setup script
          if [ -f "scripts/setup-github-apps.sh" ]; then
            echo "Generalizing setup script..."
            sed -i 's/dining-philosophers-Dec25-sw-factory/your-project/g' scripts/setup-github-apps.sh
            sed -i 's/DP Code Agent/Code Agent/g' scripts/setup-github-apps.sh
            sed -i 's/DP Factory Manager/Factory Manager/g' scripts/setup-github-apps.sh
            sed -i 's/DP DevOps/DevOps/g' scripts/setup-github-apps.sh
            sed -i 's/DP Triage/Triage/g' scripts/setup-github-apps.sh
            sed -i 's/DP QA/QA/g' scripts/setup-github-apps.sh
          fi

          echo "Generalization complete"

      - name: Check for changes
        id: changes
        working-directory: template
        run: |
          # Stage all changes first (including new files)
          git add -A

          # Show what would be committed
          git diff --cached --stat

          # Check if there are any staged changes
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to sync"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
          fi

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true' && github.event.inputs.dry_run != 'true'
        working-directory: template
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Files already staged in "Check for changes" step
          git commit -m "sync: workflow improvements from upstream

          Auto-synced and generalized from upstream project
          Source commit: ${{ github.sha }}"

          git push

      - name: Summary
        run: |
          if [ "${{ steps.changes.outputs.has_changes }}" == "true" ]; then
            if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
              echo "🔍 Dry run - changes detected but not pushed"
            else
              echo "✅ Synced workflow improvements to template repo"
            fi
          else
            echo "ℹ️ No changes to sync"
          fi
